name: PR Checks

on:
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  create_artifact:
    name: "PR Check Job"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "TEST: uninstall.php exists"
        run: |
          file="uninstall.php"
          if [ -f $file ]; then echo "$file exists"; else exit 1; fi;